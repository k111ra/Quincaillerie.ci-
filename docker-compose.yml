services:
  app:
    container_name: quincaillerie_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:80"
    volumes:
      - .:/var/www/html
    networks:
      - quincaillerie_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: quincaillerie_db
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quincaillerie
      MYSQL_USER: quincaillerie_user
      MYSQL_PASSWORD: quincaillerie_password
    volumes:
      - quincaillerie_db_data:/var/lib/mysql
    networks:
      - quincaillerie_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: quincaillerie_phpmyadmin
    ports:
      - "8180:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - quincaillerie_network

networks:
  quincaillerie_network:
    driver: bridge

volumes:
  quincaillerie_db_data:
